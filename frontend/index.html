<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontend de Prueba</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <h1>¡Despliegue Exitoso con Docker Compose! 🚀</h1>
    <p>El frontend se está ejecutando en Nginx desde un contenedor en producción.</p>

    <p id="mensaje" style="font-size: 22px; font-weight: bold; margin-top: 36px;">
        Consultando la base de datos...
    </p>
    <p id="detalle" style="color: #555; line-height: 1.6;"></p>

    <script>
        fetch('/api')
            .then(function (respuesta) { return respuesta.json(); })
            .then(function (datos) {
                var mensaje = document.getElementById('mensaje');
                var detalle = document.getElementById('detalle');
                if (datos.status === 'ok') {
                    mensaje.textContent = 'Conexión exitosa a la base de datos';
                    mensaje.style.color = '#1a7f37';
                    detalle.innerHTML =
                        'Motor: <b>' + datos.motor + '</b><br>' +
                        'Base de datos: <b>' + datos.base_de_datos + '</b>';
                } else {
                    mensaje.textContent = datos.mensaje;
                    mensaje.style.color = '#b3261e';
                    detalle.textContent = datos.detalle || '';
                }
            })
            .catch(function (error) {
                var mensaje = document.getElementById('mensaje');
                mensaje.textContent = 'No se pudo contactar la API';
                mensaje.style.color = '#b3261e';
                document.getElementById('detalle').textContent = error;
            });
    </script>
</body>
</html>
