name: Publicar Imagen en Docker Hub

on:
  push:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

env:
  DOCKERHUB_USER: jonaa07

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest bandit

      - name: Ejecutar análisis de seguridad con bandit
        run: bandit -r . -s B101

      - name: Ejecutar pruebas pytest
        run: pytest backend/

  image-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen de la API (sin publicar)
        run: docker build -t mi-api:scan ./backend

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'mi-api:scan'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  build-and-push:
    needs: [test-and-security, image-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Copiar código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen de la API
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/mi-api:latest
            ${{ env.DOCKERHUB_USER }}/mi-api:${{ github.sha }}

      - name: Construir y subir imagen del Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/mi-frontend:latest
            ${{ env.DOCKERHUB_USER }}/mi-frontend:${{ github.sha }}

      - name: Desplegar en servidor cloud
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull
            docker compose up -d
