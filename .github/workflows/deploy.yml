name: Deploy Implantacion

on:
  push:
    branches: ["main"]
    paths:
      - "taller-practico-3.3/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "taller-practico-3.3/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  DOCKERHUB_USER: jonaa07

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r taller-practico-3.3/requirements.txt
          pip install pytest bandit

      - name: Ejecutar analisis de seguridad con bandit
        run: bandit -r taller-practico-3.3 -s B101

      - name: Ejecutar pruebas pytest
        run: pytest taller-practico-3.3/

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen de la API (sin publicar)
        run: docker build -t api-implantacion:scan ./taller-practico-3.3

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.32.0
        with:
          image-ref: 'api-implantacion:scan'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  build-and-push:
    needs: [test-and-security, image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen de la API
        uses: docker/build-push-action@v4
        with:
          context: ./taller-practico-3.3
          file: ./taller-practico-3.3/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/api-implantacion:latest
            ${{ env.DOCKERHUB_USER }}/api-implantacion:${{ github.sha }}

      - name: Desplegar en servidor cloud
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IMPLANTACION_HOST }}
          username: ${{ secrets.IMPLANTACION_USER }}
          key: ${{ secrets.IMPLANTACION_SSH_KEY }}
          script: |
            cd ~/implantacion
            docker compose pull
            docker compose up -d
